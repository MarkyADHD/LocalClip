name: Desktop app

# Builds LocalClip.exe and LocalClip-Setup.exe on pull requests that touch it. Run it by hand ("Run workflow") to publish
# a GitHub release named after the version in desktop/Cargo.toml.
#
# Code signing (docs/code-signing.md): when the repository variable SIGNPATH_ORGANIZATION_ID is set, a release run
# sends LocalClip.exe and then LocalClip-Setup.exe to SignPath and waits for each to be approved there. Without the
# variable the release is published unsigned, as before.
on:
  pull_request:
    paths:
      - desktop/**
      - assets/localclip.ico
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read # SignPath reads the workflow run and its artifacts

env:
  SIGN: ${{ github.event_name == 'workflow_dispatch' && vars.SIGNPATH_ORGANIZATION_ID != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LocalClip.exe
        working-directory: desktop
        run: cargo test --release --locked && cargo build --release --locked
      - run: |
          Copy-Item desktop/target/release/localclip.exe LocalClip.exe
          $version = (Select-String -Path desktop/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          "LOCALCLIP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Upload the unsigned app
        if: env.SIGN == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: LocalClip.exe
      - name: Sign the app (waits for approval in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: LocalClip
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.LOCALCLIP_VERSION) }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-exe
      - name: Put the signed app where the installer and the release pick it up
        if: env.SIGN == 'true'
        run: |
          Copy-Item signed-exe/LocalClip.exe LocalClip.exe -Force
          Copy-Item signed-exe/LocalClip.exe desktop/target/release/localclip.exe -Force
      - name: Build LocalClip-Setup.exe
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc desktop/setup.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Upload the unsigned installer
        if: env.SIGN == 'true'
        id: unsigned-installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: LocalClip-Setup.exe
      - name: Sign the installer (waits for approval in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: LocalClip
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          parameters: |
            version: ${{ toJSON(env.LOCALCLIP_VERSION) }}
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: signed-installer
      - name: Check both files are signed
        if: env.SIGN == 'true'
        run: |
          Copy-Item signed-installer/LocalClip-Setup.exe LocalClip-Setup.exe -Force
          foreach ($file in 'LocalClip.exe', 'LocalClip-Setup.exe') {
            $status = (Get-AuthenticodeSignature $file).Status
            if ($status -ne 'Valid') { throw "$file signature is $status" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: LocalClip
          path: |
            LocalClip-Setup.exe
            LocalClip.exe
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:LOCALCLIP_VERSION
          gh release create "v$version" LocalClip-Setup.exe LocalClip.exe Install-LocalClip.cmd --target $env:GITHUB_SHA --title "LocalClip v$version" --generate-notes
