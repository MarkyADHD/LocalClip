name: Desktop app

# Builds LocalClip.exe on pull requests that touch it. Run it by hand ("Run workflow") to publish
# a GitHub release named after the version in desktop/Cargo.toml.
on:
  pull_request:
    paths:
      - desktop/**
      - assets/localclip.ico
      - .github/workflows/desktop.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build LocalClip.exe
        working-directory: desktop
        run: cargo build --release --locked
      - run: Copy-Item desktop/target/release/localclip.exe LocalClip.exe
      - uses: actions/upload-artifact@v4
        with:
          name: LocalClip.exe
          path: LocalClip.exe
      - name: Publish the release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Select-String -Path desktop/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          gh release create "v$version" LocalClip.exe Install-LocalClip.cmd --target $env:GITHUB_SHA --title "LocalClip v$version" --generate-notes
